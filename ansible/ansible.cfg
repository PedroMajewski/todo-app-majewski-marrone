[defaults]
inventory = inventory/hosts.yml
roles_path = roles
interpreter_python = auto_silent
forks = 5
retry_files_enabled = False
# Saída legível nos logs da pipeline e tempo de cada tarefa
callback_result_format = yaml
callbacks_enabled = ansible.posix.profile_tasks
display_skipped_hosts = False
any_errors_fatal = True

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o StrictHostKeyChecking=accept-new
